<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trayecto Cali a Pasto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" id="main-stage">
  <!-- MAPA VECTORIAL CON FONDO CLARO (CIELO, SOL Y NUBES) -->
  <svg class="map-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
    <!-- Cielo azul claro -->
    <rect width="1000" height="600" fill="#7dd3fc" />

    <!-- Sol brillante -->
    <circle cx="900" cy="90" r="45" fill="#fde047" opacity="0.95" />
    <circle cx="900" cy="90" r="55" fill="#fef08a" opacity="0.4" />

    <!-- Nubes suaves -->
    <g fill="#ffffff" opacity="0.85">
      <!-- Nube 1 (Izquierda) -->
      <path d="M 100 100 Q 120 70, 150 80 Q 180 60, 210 80 Q 230 100, 210 120 L 100 120 Z" />
      <circle cx="120" cy="100" r="25" />
      <circle cx="155" cy="85" r="30" />
      <circle cx="190" cy="98" r="22" />

      <!-- Nube 2 (Centro-Derecha) -->
      <path d="M 500 120 Q 520 90, 550 100 Q 580 80, 610 100 Q 630 120, 610 140 L 500 140 Z" />
      <circle cx="525" cy="120" r="22" />
      <circle cx="560" cy="105" r="28" />
      <circle cx="590" cy="118" r="20" />

      <!-- Nube 3 (Fondo Suave) -->
      <circle cx="780" cy="150" r="20" opacity="0.6" />
      <circle cx="805" cy="140" r="26" opacity="0.6" />
      <circle cx="830" cy="150" r="18" opacity="0.6" />
    </g>

    <!-- Montañas claras en degrade verde/azulado -->
    <path d="M 0 380 Q 200 240, 450 390 Q 650 280, 850 380 Q 950 310, 1000 370 L 1000 600 L 0 600 Z" fill="#86efac" />
    <path d="M 0 430 Q 180 320, 380 440 Q 600 330, 800 430 Q 920 360, 1000 420 L 1000 600 L 0 600 Z" fill="#4ade80" opacity="0.8" />

    <!-- Carretera de Cali a Pasto -->
    <path id="route-path" d="M 180 140 C 400 200, 300 420, 750 460" fill="none" stroke="#475569" stroke-width="20" stroke-linecap="round" />
    <path d="M 180 140 C 400 200, 300 420, 750 460" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" />

    <!-- Puntos de Origen (Cali) y Destino (Pasto) -->
    <circle cx="180" cy="140" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="3" />
    <circle cx="750" cy="460" r="14" fill="#10b981" stroke="#ffffff" stroke-width="3" />

    <!-- CARRITO Y FOTO DE ELLA VIAJANDO SOBRE LA RUTA -->
    <g class="traveler-group" id="traveler">
      <!-- Foto de Ella -->
      <g transform="translate(-30, -75)">
        <foreignObject width="60" height="60">
          <div xmlns="http://www.w3.org/1999/xhtml" class="photo-wrapper">
            <img src="foto-ella.png" alt="Ella" class="passenger-photo">
          </div>
        </foreignObject>
      </g>

      <!-- Carrito en SVG -->
      <g transform="translate(-25, -15)">
        <rect x="0" y="0" width="50" height="26" rx="8" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
        <rect x="10" y="3" width="28" height="10" rx="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
        <circle cx="10" cy="26" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
        <circle cx="40" cy="26" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
      </g>
    </g>
  </svg>

  <!-- Etiquetas de Ciudades -->
  <div class="city-tag city-cali">📍 Cali</div>
  <div class="city-tag city-pasto">📍 Pasto</div>

  <!-- Escena Final de Encuentro en Pasto -->
  <div class="meeting-scene" id="meeting">
    <div class="love-message">¡Toma para ti negrita! 🌹</div>
    
    <!-- Tu foto -->
    <div class="person-card">
      <img src="foto-mia.png" alt="Yo" class="my-photo">
    </div>

    <!-- Ramo de Rosas -->
    <div class="bouquet-container" id="bouquet">
      <img src="ramo.png" alt="Ramo de Rosas" class="bouquet-img">
    </div>

    <!-- Foto de Ella -->
    <div class="person-card">
      <img src="foto-ella.png" alt="Ella" class="her-photo">
    </div>

    <!-- Botón para ver de nuevo -->
    <button class="replay-btn" id="replay-btn" onclick="replayAnimation()">🔄 Ver de nuevo</button>
  </div>
</div>

<script>
  function replayAnimation() {
    const stage = document.getElementById('main-stage');
    // Reinicia las animaciones clonando y reemplazando los elementos
    const newStage = stage.cloneNode(true);
    stage.parentNode.replaceChild(newStage, stage);
  }
</script>

</body>
</html>
